plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            // dev only: gradlew runClient -Ptour=path/to/script [-PtourWorld=folder] plays a PhotoTour script
            if (project.hasProperty('tourMenu')) {
                programArguments.addAll('--width', '1600', '--height', '900')
                systemProperty 'takemtitans.tour', 'menu'
                systemProperty 'takemtitans.tourMenu', 'true'
            }
            if (project.hasProperty('tour')) {
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('tourWorld') ?: 'tour', '--width', '1600', '--height', '900')
                systemProperty 'takemtitans.tour', file(project.property('tour')).absolutePath
            }
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
